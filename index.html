<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>مكة في السحاب · 云上麦加</title>
<meta name="description" content="محاكاة تعليمية لرحلة الحج خطوة بخطوة في مشاهد ثلاثية الأبعاد · 一步步模拟朝觐的 3D 教学体验">
<meta name="theme-color" content="#0b6b52">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مكة في السحاب">
<meta property="og:title" content="مكة في السحاب · 云上麦加">
<meta property="og:description" content="محاكاة رحلة الحج خطوة بخطوة · 朝觐模拟">
<meta property="og:image" content="/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700&family=Noto+Naskh+Arabic:wght@400;600&family=Noto+Sans+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--green:#0b6b52;--green2:#10896a;--gold:#b98d36;--gold2:#e2bd66;--ink:#17221f;--muted:#5d6b66;--paper:#fbfaf6;--line:rgba(11,107,82,.16);--shadow:0 10px 40px rgba(10,30,25,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#dfe7ea;color:var(--ink);font-family:"Noto Naskh Arabic","Noto Sans SC","PingFang SC",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
html[lang=zh-CN] body{font-family:"Noto Sans SC","PingFang SC","Noto Naskh Arabic",system-ui,sans-serif}
h1,h2,h3,.kufi{font-family:"Noto Kufi Arabic","Noto Sans SC",sans-serif}
#stage{position:fixed;inset:0}#stage canvas{display:block;width:100%;height:100%}
button{font-family:inherit;color:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;user-select:text;-webkit-user-select:text}
.hud{position:fixed;z-index:5;pointer-events:none}.hud>*{pointer-events:auto}
#topbar{top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
#tl{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.pill{background:rgba(255,255,255,.88);border:1px solid var(--line);padding:5px 12px;border-radius:999px;font-size:13px;color:var(--ink);box-shadow:0 2px 12px rgba(0,0,0,.08);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#zone{font-weight:600;color:var(--green);pointer-events:none}
.pill.opt{display:none}.pill.opt.show{display:inline-block;cursor:pointer}
#online i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#2fbf71;margin-inline-end:6px}
#tr{display:flex;gap:8px}
.icon{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.9);font-size:16px;display:grid;place-items:center;box-shadow:0 2px 12px rgba(0,0,0,.08)}
#acctbtn.in{background:var(--green);color:#fff;font-weight:700}
#actions{left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:0 12px;pointer-events:none}
#actions button{pointer-events:auto;border:none;background:var(--green);color:#fff;padding:12px 20px;border-radius:14px;font-size:16px;font-weight:600;box-shadow:var(--shadow);animation:rise .3s ease}
#actions button.sec{background:#fff;color:var(--green);border:1px solid var(--line)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#hint{left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 140px);font-size:13px;background:rgba(255,255,255,.9);padding:6px 14px;border-radius:999px;transition:opacity 1s;white-space:nowrap;pointer-events:none;color:var(--muted)}
#joy{left:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);width:108px;height:108px;border-radius:50%;border:1px solid rgba(255,255,255,.7);background:radial-gradient(circle,rgba(255,255,255,.35),rgba(255,255,255,.12));display:none;touch-action:none}
#knob{position:absolute;left:34px;top:34px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 2px 8px rgba(0,0,0,.2)}
body.touch #joy{display:block}body.touch.in #actions{padding-left:136px}
#dock{left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:none;gap:2px;padding:6px;border-radius:20px;background:rgba(255,255,255,.94);border:1px solid var(--line);box-shadow:var(--shadow)}
body.in #dock{display:flex}body.sheet #dock,body.sheet #actions{display:none}
#dock button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:58px;padding:5px 4px;border-radius:14px;color:var(--ink)}
#dock button.main{background:var(--green);color:#fff}
#dock b{font-size:19px;line-height:1;font-weight:400}#dock span{font-size:12px}
/* sheet */
#sheet{position:fixed;z-index:20;left:50%;bottom:0;transform:translate(-50%,105%);width:min(600px,100%);max-height:80vh;background:var(--paper);border-radius:22px 22px 0 0;transition:transform .36s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:0 -10px 50px rgba(0,0,0,.25)}
#sheet.open{transform:translate(-50%,0)}#sheet.mini{max-height:32vh}
#sheet .grab{width:42px;height:4px;border-radius:2px;background:#cfd8d4;margin:9px auto 0}
#sheet .head{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 4px}
#sheet h2{margin:0;font-size:19px;color:var(--green)}
#sheet .x{background:#eef2f0;border:none;width:34px;height:34px;border-radius:50%;font-size:16px;color:var(--muted)}
#sheet .body{padding:4px 18px calc(env(safe-area-inset-bottom,0px) + 22px);overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.p{color:#33413c;font-size:15px;line-height:1.95}
.small{text-align:center;color:var(--muted);font-size:13px}
.note{font-size:12px;color:var(--muted);line-height:1.8;border-top:1px dashed var(--line);margin-top:14px;padding-top:10px}
.note a{color:var(--green)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.btn{border:1px solid var(--line);background:#fff;padding:10px 16px;border-radius:12px;font-size:15px;color:var(--ink)}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.btn:disabled{opacity:.45}.btn:active{transform:scale(.97)}
.tabs{display:flex;gap:6px;margin:4px 0 10px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:none;padding:9px 10px;font-size:15px;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--green);border-bottom-color:var(--green);font-weight:600}
.field{width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:11px 12px;font-size:15px;outline:none}
textarea.field{min-height:90px;resize:vertical;line-height:1.7}
select.field{appearance:none;-webkit-appearance:none}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0}
.card .t{font-size:15px;line-height:1.8}
.card .m{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--muted)}
.card .m button{font-size:13px;padding:6px 12px}
.tag{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted);margin-inline-start:6px}
.sec{color:var(--green);font-size:14px;font-weight:600;margin:16px 0 6px}
.lbl{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:#33413c;margin:10px 0}.chk input{width:18px;height:18px;accent-color:#0b6b52}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 11px;margin:3px;font-size:13px;background:#fff;cursor:pointer}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.chips{text-align:center}
.ar{font-family:"Noto Naskh Arabic","Amiri",serif;direction:rtl;unicode-bidi:isolate;font-size:27px;line-height:2;color:var(--green);text-align:center}
.ar.sm{font-size:21px}
.tr{text-align:center;color:#33413c;font-size:14px;font-style:italic;direction:ltr}
.mean{text-align:center;color:var(--muted);font-size:14px}
.verse{font-size:17px;line-height:2;text-align:center;margin:8px 0}
.ref{text-align:center;color:var(--gold);font-size:13px;margin-bottom:10px}
.big{text-align:center;font-size:28px;color:var(--green);font-weight:700;margin:6px 0 0}
.ptable{width:100%;border-collapse:collapse;margin:8px 0}
.ptable td{padding:9px 6px;border-bottom:1px solid var(--line);font-size:16px}
.ptable td:last-child{text-align:end;font-variant-numeric:tabular-nums}
.ptable tr.nx td{color:var(--green);font-weight:700}.ptable tr.sr td{color:var(--muted);font-size:14px}
.dial{width:180px;height:180px;border-radius:50%;margin:10px auto;position:relative;border:1px solid var(--line);background:radial-gradient(circle,#fff,#eef3f1)}
.dial .rose{position:absolute;inset:0;transition:transform .15s linear}
.dial .rose b{position:absolute;left:50%;top:6px;transform:translateX(-50%);font-size:13px;color:#d0473a}
.dial .rose i{position:absolute;left:50%;top:50%;width:4px;height:76px;margin:-76px 0 0 -2px;transform-origin:50% 100%;background:linear-gradient(var(--gold2),var(--gold));border-radius:2px}
.dial .rose i:before{content:"";position:absolute;left:-7px;top:-10px;border:9px solid transparent;border-bottom:12px solid var(--gold);border-top:0}
.dial .rose em{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:2px;background:#111;border:2px solid var(--gold)}
.tap{width:196px;height:196px;border-radius:50%;margin:12px auto 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:none;background:radial-gradient(circle at 40% 35%,#14a07b,#0b6b52);color:#fff;box-shadow:0 12px 30px rgba(11,107,82,.35);touch-action:manipulation}
.tap:active{transform:scale(.96)}.tap .n{font-size:52px;font-variant-numeric:tabular-nums;line-height:1}.tap .of{font-size:13px;opacity:.85;margin-top:4px}
.steps{display:flex;gap:4px;justify-content:center;margin:4px 0 10px}.steps i{width:18px;height:4px;border-radius:2px;background:#d6dfdb}.steps i.on{background:var(--green)}
ol.st,ul.st{padding-inline-start:22px;line-height:1.9;font-size:15px;color:#33413c}ol.st li,ul.st li{margin:4px 0}
.ayah{border-bottom:1px solid var(--line);padding:10px 0}.ayah .ar{text-align:right;font-size:23px}.ayah .tx{font-size:15px;line-height:1.85;color:#33413c}
.ayah .no{display:inline-block;min-width:24px;height:24px;border:1px solid var(--line);border-radius:50%;text-align:center;font-size:12px;line-height:22px;color:var(--gold);margin-inline-end:6px}
.slist button{display:flex;width:100%;justify-content:space-between;text-align:start;margin:4px 0}.slist small{color:var(--muted)}
.tele{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tele button{text-align:start;padding:11px}.tele small{display:block;color:var(--muted);font-size:12px}
.stephead{border-radius:14px;overflow:hidden;position:relative;height:120px;margin:4px 0 10px;background:linear-gradient(135deg,#0b2a3a,#123f52)}
.stephead img{width:100%;height:100%;object-fit:cover;display:block}
.stephead div{position:absolute;inset:auto 0 0 0;padding:10px 12px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff}
.stephead small{display:block;opacity:.9;font-size:12px}.stephead b{font-size:18px}
.gal img{width:100%;border-radius:12px;display:block;background:#e6ecea}.gal .cap{font-size:13px;color:#33413c;margin:6px 2px 2px}.gal .cr{font-size:11px;color:var(--muted);direction:ltr;text-align:start;margin:0 2px 14px}.gal a{color:var(--green)}
.big2{font-size:22px;text-align:center;color:var(--green);font-weight:700;margin:8px 0}
#toast{position:fixed;z-index:25;left:50%;top:calc(env(safe-area-inset-top,0px) + 62px);transform:translateX(-50%);background:var(--green);color:#fff;padding:9px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap;box-shadow:var(--shadow)}
/* intro */
#intro{position:fixed;inset:0;z-index:30;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;background:#0b1d1a;color:#fff;transition:opacity .9s}
#intro.hide{opacity:0;pointer-events:none}
#hero{position:fixed;inset:0;overflow:hidden}
#hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.6s ease;transform:scale(1.06)}
#hero img.on{opacity:1;animation:kb 9s ease-out forwards}
@keyframes kb{from{transform:scale(1.06)}to{transform:scale(1.16)}}
#hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,20,17,.55) 0%,rgba(5,20,17,.35) 35%,rgba(5,20,17,.88) 75%,#071613 100%)}
#intro .wrap{position:relative;max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 30px}
#intro .top{display:flex;justify-content:space-between;align-items:center}
#intro .lang{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:6px 14px;font-size:14px;backdrop-filter:blur(6px)}
#intro .brand{margin-top:16vh;text-align:start}
#intro h1{font-size:40px;margin:0;line-height:1.3;letter-spacing:.01em;text-shadow:0 2px 20px rgba(0,0,0,.4)}
#intro .sub{font-size:14px;opacity:.85;margin-top:2px}
#intro .tagline{font-size:16px;line-height:1.9;opacity:.95;margin:12px 0 10px;max-width:520px}
#intro .chipd{display:inline-block;background:rgba(226,189,102,.18);border:1px solid rgba(226,189,102,.55);color:#f3dda2;border-radius:999px;padding:5px 12px;font-size:13px}
#intro .cta{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 6px}
#intro .cta .btn{padding:13px 20px;font-size:16px;border-radius:14px}
#intro .cta .ghost{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);color:#fff}
#intro h3{font-size:16px;margin:26px 0 10px;color:#f3dda2}
.jrow{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory;touch-action:pan-x pan-y}
.jcard{flex:0 0 168px;height:200px;border-radius:16px;overflow:hidden;position:relative;border:1px solid rgba(255,255,255,.18);scroll-snap-align:start;background:linear-gradient(160deg,#0f3a46,#081d24);padding:0;text-align:start;color:#fff}
.jcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.jcard .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.78))}
.jcard .tx{position:absolute;inset:auto 0 0 0;padding:10px}
.jcard small{display:block;font-size:11px;color:#f3dda2}.jcard b{font-size:15px;line-height:1.5;display:block}
.jcard .n{position:absolute;top:8px;inset-inline-start:8px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.9);color:var(--green);font-size:13px;font-weight:700;display:grid;place-items:center}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tool{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:12px 6px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px}
.tool b{font-size:22px;font-weight:400}
#intro .links{margin-top:22px;font-size:13px;display:flex;gap:14px;flex-wrap:wrap}
#intro .links a{color:#cfe3dc;text-decoration:none;border-bottom:1px dotted #7ea597}
#intro .disc{font-size:12px;opacity:.7;line-height:1.8;margin-top:12px}
#heroCredit{position:fixed;z-index:31;bottom:6px;inset-inline-end:8px;font-size:10px;color:rgba(255,255,255,.75);direction:ltr;pointer-events:auto}
#heroCredit a{color:inherit}
#intro.hide~#heroCredit{display:none}
#loading{font-size:13px;opacity:.8;margin-top:10px;min-height:18px}
@media (max-width:420px){#intro h1{font-size:34px}.tools{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div id="stage"></div>
<div class="hud" id="topbar">
  <div id="tl"><div class="pill" id="zone"></div><div class="pill opt" id="online"><i></i><span></span></div><div class="pill opt" id="npill"></div></div>
  <div id="tr"><button class="icon" id="langbtn">中</button><button class="icon" id="acctbtn">👤</button><button class="icon" id="menubtn">☰</button></div>
</div>
<div class="hud" id="actions"></div>
<div class="hud" id="hint"></div>
<div class="hud" id="joy"><div id="knob"></div></div>
<nav class="hud" id="dock">
  <button data-go="journey" class="main"><b>🕋</b><span data-i18n="dJourney"></span></button>
  <button data-go="salah"><b>🕌</b><span data-i18n="dSalah"></span></button>
  <button data-go="tasbih"><b>📿</b><span data-i18n="dTasbih"></span></button>
  <button data-go="wall"><b>🤲</b><span data-i18n="dWall"></span></button>
  <button data-go="quran"><b>📖</b><span data-i18n="dQuran"></span></button>
</nav>
<div id="toast"></div>
<div id="sheet"><div class="grab"></div><div class="head"><h2 id="sheetTitle"></h2><button class="x" id="sheetX">✕</button></div><div class="body" id="sheetBody"></div></div>

<div id="intro">
  <div id="hero"></div>
  <div class="wrap">
    <div class="top"><span class="kufi" style="opacity:.9;font-size:14px">🕋 <span data-i18n="sub"></span></span><button class="lang" id="introLang"></button></div>
    <div class="brand">
      <h1 data-i18n="title"></h1>
      <div class="tagline" data-i18n="tagline"></div>
      <span class="chipd" id="nextHajj"></span>
      <div class="cta"><button class="btn pri" data-go="journey" data-i18n="startJourney"></button><button class="btn ghost" data-go="explore" data-i18n="explore"></button></div>
      <div id="loading" data-i18n="preparing"></div>
    </div>
    <h3 data-i18n="journeyH"></h3>
    <div class="jrow" id="jrow"></div>
    <h3 data-i18n="toolsH"></h3>
    <div class="tools">
      <button class="tool" data-go="req"><b>📋</b><span data-i18n="tReq"></span></button>
      <button class="tool" data-go="salah"><b>🧭</b><span data-i18n="tSalah"></span></button>
      <button class="tool" data-go="tasbih"><b>📿</b><span data-i18n="tTasbih"></span></button>
      <button class="tool" data-go="quran"><b>📖</b><span data-i18n="tQuran"></span></button>
      <button class="tool" data-go="wall"><b>🤲</b><span data-i18n="tWall"></span></button>
      <button class="tool" data-go="gallery"><b>🖼</b><span data-i18n="tGallery"></span></button>
    </div>
    <div class="links"><a href="/privacy.html" data-i18n="privacy"></a><a href="#" data-go="support" data-i18n="support"></a><a href="#" data-go="feedback" data-i18n="fbT"></a><a href="#" id="installLink" style="display:none" data-i18n="install"></a></div>
    <div class="disc" data-i18n="disclaimer"></div>
  </div>
</div>
<div id="heroCredit"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/i18n.js?v=3"></script>
<script src="/pt.js?v=3"></script>
<script src="/app.js?v=3"></script>
</body>
</html>
